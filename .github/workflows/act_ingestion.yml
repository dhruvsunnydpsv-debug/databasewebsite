name: ACT Ingestion — Auto Booster

on:
  schedule:
    # Every 30 minutes
    - cron: '15,45 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    name: Generate ACT Questions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase groq python-dotenv requests beautifulsoup4

      - name: Run ACT Ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd databasewebsite
          python act_booster.py
          python act_scraper.py

      - name: Print summary
        if: always()
        run: echo "### ✅ ACT Boost complete at $(date -u)" >> $GITHUB_STEP_SUMMARY
